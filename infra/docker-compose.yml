services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citymind}
      POSTGRES_USER: ${POSTGRES_USER:-citymind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citymind}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - citymind_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-citymind} -d ${POSTGRES_DB:-citymind}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-CityMind Tripoli}
      CITY_NAME: ${CITY_NAME:-Tripoli}
      COUNTRY_NAME: ${COUNTRY_NAME:-Lebanon}
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-citymind}:${POSTGRES_PASSWORD:-citymind}@db:5432/${POSTGRES_DB:-citymind}
      DATABASE_READINESS_REQUIRED: ${DATABASE_READINESS_REQUIRED:-false}
      OPERATIONAL_PERSISTENCE_BACKEND: ${OPERATIONAL_PERSISTENCE_BACKEND:-memory}
      SCENARIO_PERSISTENCE_BACKEND: ${SCENARIO_PERSISTENCE_BACKEND:-memory}
      SCENARIO_HISTORY_LIMIT: ${SCENARIO_HISTORY_LIMIT:-100}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-citymind-local-development-secret-change-before-production}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-memory}
      # Local development only: enables the documented demo accounts.
      ALLOW_DEMO_USERS: ${ALLOW_DEMO_USERS:-true}
      # In-memory stores live per process, so development runs a single worker.
      API_WORKERS: "1"
      AI_PROVIDER: ${AI_PROVIDER:-local_rag}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    ports:
      - "127.0.0.1:${API_PORT:-8100}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8100}
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    depends_on:
      api:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-citymind}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-citymind-local-password}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - citymind_minio_data:/data

volumes:
  citymind_postgres_data:
  citymind_minio_data:
