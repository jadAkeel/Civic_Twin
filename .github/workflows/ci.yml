name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  api-integration:
    name: API against PostGIS
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: citymind
          POSTGRES_USER: citymind
          POSTGRES_PASSWORD: citymind-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U citymind -d citymind"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://citymind:citymind-ci@localhost:5432/citymind
      DATABASE_READINESS_REQUIRED: "true"
      OPERATIONAL_PERSISTENCE_BACKEND: database
      SCENARIO_PERSISTENCE_BACKEND: database
      RATE_LIMIT_BACKEND: database
      ALLOW_DEMO_USERS: "true"
      CITYMIND_DATABASE_INTEGRATION: "1"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrate
        run: alembic upgrade head
      - name: Load baseline
        run: python -m app.seed.load_seed --if-empty
      - name: Integration tests
        run: python -m pytest -q tests/test_database_integration.py
      - name: Migrations are reversible
        run: alembic downgrade 20260803_0003 && alembic upgrade head

  web:
    name: Web lint, types, build and browser tests
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: node scripts/frontend_smoke.mjs
      - run: pnpm --filter @citymind/web exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:e2e
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/.codex-runtime/playwright-report
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip-audit -r apps/api/requirements.txt

  images:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t citymind-api:ci .
      - run: docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=https://api.citymind.example -t citymind-web:ci .
      - name: Web image serves static assets
        run: |
          docker run -d --name web -p 3000:3000 citymind-web:ci
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/login >/dev/null && break; sleep 2; done
          curl -fsS -o /dev/null http://127.0.0.1:3000/brand/citymind-mark.png
